<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>서울 문화행사 안내</title>
    <meta
      name="description"
      content="서울문화포털 공공데이터를 바탕으로 공연, 전시, 축제 등 서울의 문화행사를 안내합니다."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%238c1f1b'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='28' fill='%23f4efe6' font-family='serif'%3E文%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="page-frame">
      <header class="masthead">
        <div class="masthead-kicker">
          <span>서울 열린데이터광장 · 서울문화포털</span>
          <span id="todayLabel"></span>
        </div>
        <div class="masthead-row">
          <h1>서울 문화행사 안내</h1>
          <p class="masthead-lead">
            공연, 전시, 축제까지 — 서울에서 열리는 문화행사를 한곳에서 살펴보세요.
          </p>
        </div>
      </header>

      <section class="filter-panel" aria-label="행사 검색">
        <form id="searchForm" class="filter-grid">
          <label class="field field-grow">
            <span>행사명 검색</span>
            <input
              id="titleInput"
              type="search"
              name="title"
              placeholder="예: 재즈, 서울시향, 전시"
              autocomplete="off"
            />
          </label>
          <label class="field">
            <span>분류</span>
            <select id="codeSelect" name="code">
              <option value="">전체 분류</option>
            </select>
          </label>
          <label class="field">
            <span>자치구</span>
            <select id="districtSelect" name="district">
              <option value="">전체 지역</option>
            </select>
          </label>
          <label class="field">
            <span>날짜</span>
            <input id="dateInput" type="date" name="date" />
          </label>
          <label class="field">
            <span>유·무료</span>
            <select id="feeSelect" name="fee">
              <option value="">전체</option>
              <option value="무료">무료</option>
              <option value="유료">유료</option>
            </select>
          </label>
          <div class="filter-actions">
            <button type="submit" class="btn-primary">찾아보기</button>
            <button type="button" id="resetBtn" class="btn-ghost">초기화</button>
          </div>
        </form>
        <p id="resultMeta" class="result-meta">서울시 문화행사 정보를 불러오는 중입니다.</p>
      </section>

      <main>
        <div id="statusArea" class="status-area" hidden></div>
        <section id="eventGrid" class="event-grid" aria-live="polite"></section>
        <nav id="pagination" class="pagination" aria-label="페이지 이동"></nav>
      </main>

      <footer class="site-footer">
        <p>
          본 사이트는 서울 열린데이터광장의
          <strong>서울시 문화행사 정보</strong> OpenAPI를 이용합니다. 원문은
          <a href="https://culture.seoul.go.kr" target="_blank" rel="noopener noreferrer">서울문화포털</a>에서
          확인할 수 있습니다.
        </p>
      </footer>
    </div>

    <dialog id="detailDialog" class="detail-dialog">
      <article id="detailContent" class="detail-sheet"></article>
    </dialog>

    <script src="js/app.js"></script>
  </body>
</html>
